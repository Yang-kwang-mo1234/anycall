[package]
name = "anycall"
version = "0.2.0"
description = "Windows 동영상 실시간 번역 자막 (영어·일본어 → 한국어, 온디바이스)"
edition = "2021"

[dependencies]
sherpa-onnx = { version = "2.0.1", default-features = false, features = ["static"] }
# 번역(Hy-MT2-1.8B GGUF). llama.cpp를 소스로 빌드한다(CMake, bindgen용 libclang 필요: scripts/build.ps1).
# 기본 기능의 openmp는 MSVC에서 vcomp DLL이 따라와야 해서 끈다(ggml 자체 스레드 풀을 쓴다).
llama-cpp-2 = { version = "0.1.161", default-features = false }
anyhow = "1"
wasapi = "0.27.0"
eframe = { version = "0.37.0", features = ["glow"] }
encoding_rs = "0.8"
raw-window-handle = "0.6.2"
windows-core = "0.62"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# 실행 파일 아이콘(build.rs)
winresource = "0.1.34"
